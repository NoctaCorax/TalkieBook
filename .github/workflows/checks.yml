name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Tests -v

  native-typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check native sources
        run: swiftc -swift-version 5 -parse-as-library -typecheck Sources/*.swift -framework SwiftUI -framework WebKit -framework AVFoundation -framework AppKit
